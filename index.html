<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
          <div class="calculator">
        <div class="display">
            <div class="calculation">45 + 4 =</div>
            <div class="current">49</div>
        </div>
        <div class="buttons">
            <button class="bigger">AC</button>
            <button class="bigger">Del</button>
            <button>÷</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button class="bigger2">0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>  
    </div>

    
</body>
</html>
